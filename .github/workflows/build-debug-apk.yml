name: Debug APK

# A plain debug apk, signed with the debug key, for putting on a phone.
#
# Separate from android.yml on purpose: that one builds a *release* apk, insists
# on the four production signing secrets and verifies the permanent certificate
# -- none of which a build for testing should need. Nothing here touches a
# release, a tag or the store.
#
# Two things about this repository decide the shape of the job below.
#
# 1. The native library cannot be compiled here. libpes17.so is the recompiled
#    title, made from the disc's own executables, and those are in no repository
#    -- so there is nothing in this tree to run CMake over. The app packages a
#    prebuilt engine instead (`-PprebuiltNative=<dir>`, see app/build.gradle.kts),
#    which is why the job downloads a published engine apk, checks its SHA-256
#    and unpacks lib/arm64-v8a from it before Gradle runs. Without that step
#    assembleDebug would try to compile 1,600 generated units that are not here.
#    A fork that HAS built an engine from these sources points the two variables
#    below at its own release asset and gets an apk carrying its own engine.
#
# 2. The Gradle wrapper lives in android/, not at the root: `./gradlew` here
#    means `android/gradlew` run from `android/`.
#
# Triggers: `main` as asked, the freebuff/* working branches and the
# typhonstickfix* / typhonfix* work branches so a push to one of them produces an
# apk to test, and workflow_dispatch for running it by hand. GitHub's "Run workflow" picker
# only lists workflows on the repository's default branch, so a hand-run needs
# this file there first; a push works either way.
#
# A branch missing from this list is the whole reason push can look like it did
# nothing: no run is created at all, so there is no red build to read, just an
# empty Actions tab.
on:
  push:
    branches:
      - main
      - 'freebuff/**'
      - 'typhonstickfix*'
      - 'typhonfix*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The published engine unless a fork sets its own (Settings > Secrets and
  # variables > Actions > Variables).
  ENGINE_URL: "${{ vars.PES17_ENGINE_URL || 'https://github.com/dzakyraf/pes2017-recomp/releases/download/0.2.0/pes2017-recomp-0.2.0.apk' }}"
  ENGINE_SHA256: "${{ vars.PES17_ENGINE_SHA256 || '843e276c2f86adc6057c0ed5288ab64110195342ac6bbeec1e6ce663b83ce1d6' }}"

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: What is being built
        run: |
          echo "ref:   $GITHUB_REF"
          echo "sha:   $GITHUB_SHA"
          echo "actor: $GITHUB_ACTOR"
          echo "event: $GITHUB_EVENT_NAME"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Hashes the wrapper properties and every build script, so the Gradle
          # caches are only reused when the build itself has not changed.
          cache: 'gradle'

      # The SDK is set up here rather than through a third-party action: the
      # action decides for itself where the SDK lives and what it installs, and
      # when it fails it fails inside its own step with nothing in the log about
      # why. These two steps are the same thing done with the tools Google
      # publishes, so the failure -- if there is one -- is a line of shell.
      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk"

      - name: Install SDK components via sdkmanager
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"

          # The command-line tools are not in the image, so they are fetched.
          # 11076708 is the current linux build of them; the zip always unpacks
          # a directory called cmdline-tools, which sdkmanager insists is named
          # "latest" before it will accept packages.
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sSL --retry 3 "$CMDLINE_TOOLS_URL" -o /tmp/cmdline-tools.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm /tmp/cmdline-tools.zip

          # Licenses first: sdkmanager exits non-zero when stdin ends under
          # `yes`, which is expected -- the licenses are the point.
          #
          # The install is deliberately NOT piped through `yes`: under
          # `set -o pipefail` a `yes` closed early (SIGPIPE, 141) fails the whole
          # pipeline even when sdkmanager succeeded, which is the kind of silent
          # red build this file exists to stop.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          # What the build will actually use, in the log rather than in a
          # screenshot of a successful job.
          sdkmanager --list_installed
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # See note 1 at the top of the file: there is no native source here to
      # compile, so the engine is fetched and its checksum enforced.
      - name: Fetch the native engine
        run: |
          echo "engine: $ENGINE_URL"
          mkdir -p "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a"
          curl -sL --retry 3 -o /tmp/upstream.apk "$ENGINE_URL"
          if [ ! -f /tmp/upstream.apk ]; then
            echo "ERROR: could not download the apk with the native engine."
            exit 1
          fi
          echo "$ENGINE_SHA256  /tmp/upstream.apk" \
            | sha256sum -c - || { echo "ERROR: engine checksum mismatch!"; exit 1; }
          unzip -j /tmp/upstream.apk "lib/arm64-v8a/*" -d "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/"
          ls -lh "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/"

      # Which of the app's entry points this engine has. One built before a
      # function existed does not export it, and the app asks before calling it,
      # so the cost is that feature and not the whole app -- but which features
      # those are belongs in the log.
      - name: Audit the engine's entry points
        run: |
          ./tools/engine_symbols.sh \
            "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/libpes17.so"

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          PREBUILT="$GITHUB_WORKSPACE/libpes17_prebuilt"
          ./gradlew :app:testDebugUnitTest -PprebuiltNative="$PREBUILT" --stacktrace

      - name: Build debug APK
        working-directory: android
        run: |
          PREBUILT="$GITHUB_WORKSPACE/libpes17_prebuilt"
          echo "Building debug apk with prebuiltNative=$PREBUILT"
          ./gradlew :app:assembleDebug -PprebuiltNative="$PREBUILT" --stacktrace

      - name: Check the APK carries the engine
        run: |
          APK=$(ls "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libpes17.so" \
            || { echo "ERROR: libpes17.so missing from the apk -- it would install and die on launch."; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pes17-touch-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Kept even when the build fails: a failing unit test is read from its
      # report, and the report only exists on the runner.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pes17-touch-unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
