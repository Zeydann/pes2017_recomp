# Builds the release APK and publishes it as a GitHub Release, so a push to
# main ends with a download link. This fork carries none of the upstream
# production signing secrets, so the APK is signed with a throwaway key kept
# in the Actions cache: the first run makes the key, later runs restore it,
# and a new build installs over the previous one instead of asking for an
# uninstall that would take Android/data with it. The cache drops after 90
# idle days, and the build after that makes a new key. The key password is
# public on purpose; it signs test builds, not anything shipped officially.
name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore the fork signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fork-signing
          key: fork-signing-key-v1

      - name: Make the signing key on the first run
        run: |
          mkdir -p "$RUNNER_TEMP/fork-signing"
          KEYSTORE="$RUNNER_TEMP/fork-signing/fork.keystore"
          if [ -f "$KEYSTORE" ]; then
            echo "Restored the fork signing key from the Actions cache."
          else
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias fork -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android \
              -dname "CN=PES 2017 fork build, O=PES 2017, C=ID"
            echo "Created a new fork signing key."
          fi
          keytool -list -keystore "$KEYSTORE" -storepass android -alias fork

      - name: Accept Android SDK Licenses & Fetch Prebuilt Native Library
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a"
          echo "Downloading official release native engine components..."
          curl -sL --retry 3 -o /tmp/upstream.apk "https://github.com/dzakyraf/pes2017-recomp/releases/download/0.2.0/pes2017-recomp-0.2.0.apk"
          if [ ! -f /tmp/upstream.apk ]; then
            echo "ERROR: Failed to download the upstream reference APK!"
            exit 1
          fi
          echo "Verifying upstream APK SHA-256 checksum..."
          echo "843e276c2f86adc6057c0ed5288ab64110195342ac6bbeec1e6ce663b83ce1d6  /tmp/upstream.apk" | sha256sum -c - || {
            echo "ERROR: Upstream APK SHA-256 checksum verification failed!"
            exit 1
          }
          unzip -j /tmp/upstream.apk "lib/arm64-v8a/*" -d "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/"
          ls -lh "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/"

      # Every run gets a higher versionCode than the one before, so the app can
      # offer the next build as an update. The base is far above the upstream
      # releases' numbers because this fork's key differs from theirs: the
      # first install needs an uninstall anyway.
      - name: Number this build
        run: echo "PES17_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          PES17_KEYSTORE: ${{ runner.temp }}/fork-signing/fork.keystore
          PES17_KEYSTORE_PASSWORD: android
          PES17_KEY_ALIAS: fork
          PES17_KEY_PASSWORD: android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease -PprebuiltNative="$GITHUB_WORKSPACE/libpes17_prebuilt" --stacktrace
          ls -lh app/build/outputs/apk/release/

      # The tag comes from the versionName the build actually carries, so the
      # workflow never repeats a version number the Gradle file may change.
      # The notes list the commits since the last release, eight lines at
      # most, and carry the versionCode the app's update check reads.
      - name: Check the APK, name it, and write the release notes
        id: notes
        run: |
          set -e
          APK=$(ls "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unzip -l "$APK" | grep "lib/arm64-v8a/libpes17.so" || { echo "ERROR: libpes17.so is missing from the APK!"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1)
          VERSION=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          ASSET="PES2017-port-${VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$ASSET"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' --match 'V*' 2>/dev/null || true)
          if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD 2>/dev/null; then
            git log --no-merges --pretty='- %s' "$PREV..HEAD"
          else
            git log --no-merges --pretty='- %s' -n 8 HEAD
          fi | head -n 8 > "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "APK versionCode: $CODE"
            echo
            echo "Fork build, signed with its own key: uninstall an official build before the first install."
          } >> "$RUNNER_TEMP/release-notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Release $TAG built as $ASSET, versionCode $CODE"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-apk-${{ github.run_number }}
          path: ${{ steps.notes.outputs.asset }}
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: PES 2017 port ${{ steps.notes.outputs.version }} (build ${{ github.run_number }})
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ steps.notes.outputs.asset }}
          make_latest: true
          fail_on_unmatched_files: true